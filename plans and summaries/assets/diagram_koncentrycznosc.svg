<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="Współśrodkowe okręgi podzielone na sektory kątowe; tylko kilka punktów jest aktywnych, reszta koszyków jest pusta.">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1b2430">Idea mechanizmu „radialnego” (E9): współśrodkowość</text>
  <g transform="translate(320,190)">
    <circle r="115" fill="none" stroke="#dfe3e6" stroke-width="1"/>
    <circle r="88" fill="none" stroke="#dfe3e6" stroke-width="1"/>
    <circle r="61" fill="none" stroke="#dfe3e6" stroke-width="1"/>
    <circle r="34" fill="none" stroke="#dfe3e6" stroke-width="1"/>
    <g stroke="#e4e8ea" stroke-width="1">
      <line x1="0" y1="-115" x2="0" y2="115"/>
      <line x1="-115" y1="0" x2="115" y2="0"/>
      <line x1="-81.3" y1="-81.3" x2="81.3" y2="81.3"/>
      <line x1="-81.3" y1="81.3" x2="81.3" y2="-81.3"/>
      <line x1="-99.6" y1="-42.2" x2="99.6" y2="42.2"/>
      <line x1="-42.2" y1="-99.6" x2="42.2" y2="99.6"/>
      <line x1="-99.6" y1="42.2" x2="99.6" y2="-42.2"/>
      <line x1="-42.2" y1="99.6" x2="42.2" y2="-99.6"/>
    </g>
    <circle r="61" fill="none" stroke="#1f7a72" stroke-width="2.5"/>
    <text x="70" y="-58" font-size="12.5" fill="#1f7a72">jeden „koszyk promienia”</text>
    <g fill="#c9581f">
      <circle cx="52.8" cy="-30.5" r="5.5"/>
      <circle cx="-58.0" cy="15.9" r="5.5"/>
      <circle cx="15.0" cy="59.1" r="5.5"/>
    </g>
    <circle cx="0" cy="0" r="4.5" fill="#1b2430"/>
    <text x="0" y="20" text-anchor="middle" font-size="12.5" fill="#4c5c62">jądro</text>
  </g>
  <text x="30" y="60" font-size="13" fill="#4c5c62">12 sektorów kątowych × 4 okręgi (promienie)</text>
  <text x="610" y="60" font-size="13" fill="#c9581f" text-anchor="end">tylko 3 aktywne punkty na cały obraz</text>
  <g font-size="13">
    <rect x="20" y="290" width="14" height="14" fill="#1f7a72"/>
    <text x="40" y="301" fill="#4c5c62">jeden „koszyk” — te punkty powinny być spójne</text>
    <circle cx="27" cy="320" r="6" fill="#c9581f"/>
    <text x="40" y="325" fill="#4c5c62">rzeczywiście aktywny punkt (jest ich mało — tyle, ile wiek)</text>
  </g>
</svg>
