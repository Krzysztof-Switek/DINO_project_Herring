# 09.08 — Izolacja Zmiany A (attention density head) od Zmiany B (windowed E9).
# Dopełnienie macierzy 2×2 rozpoczętej przez config_isolate_b.yaml. Stan po `outputs/08.08_isolate_b`:
#   (A wył. / B wył.) = produkcja 22.07_reg          → MAE 0,7993, lokalizacja: artefakt brzegowy
#   (A wył. / B wł.)  = 08.08_isolate_b               → density budzi się @e16 (normalnie!), ALE
#                                                        wciąż w dużej mierze na krawędzi — WNIOSEK:
#                                                        samo "budzenie się" density NIE jest tym
#                                                        samym co "dobra lokalizacja"
#   (A wł.  / B wł.)  = Run K (06.08_attention_first) → density martwa przez WSZYSTKIE 50 epok
#   (A wł.  / B wył.) = TEN BIEG                       → brakująca komórka macierzy
#
# Pytanie mechaniczne: czy density budzi się pod samą architekturą uwagi (bez okienkowej straty)?
# Jeśli TAK → to interakcja A+B (nie sama Zmiana A) zabiła density w Run K.
# Jeśli NIE → sama architektura uwagi (AttentionDensityHead, src/model.py) jest podejrzana —
#   najbardziej prawdopodobny konkretny powód: BRAK kodowania pozycyjnego/promieniowego — global
#   self-attention po TREŚCI patchy może homogenizować reprezentacje, utrudniając przekroczenie
#   progu 0,5 (hipoteza z 08.08 code-review, niezweryfikowana wprost).
#
# WAŻNE — priorytetem całej tej serii biegów jest POPRAWNA LOKALIZACJA PRZYROSTÓW, nie sama
# mechanika "czy density > 0". `08.08_isolate_b` pokazał to dobitnie: density ożyła normalnie, ale
# wizualna inspekcja kart (cards/emb_on_emb/) pokazała nadal dominujący artefakt brzegowy — LICZBOWO
# density wypadła najgorsza z czterech metod (225px vs 176px klasyki). Przy ocenie TEGO biegu:
# 1) sprawdź czy density w ogóle ożywa (density_active w logu), 2) jeśli tak — OBEJRZYJ realne karty
# (nie tylko liczby z localization_quality.json) i oceń, czy mapa faktycznie podąża za pierścieniami
# WEWNĄTRZ otolitu, czy nadal głównie za konturem/krawędzią. Sama aktywacja bez poprawy jakości
# NIE uzasadnia promowania Zmiany A do configu produkcyjnego.
#
# Zobacz też: plans and summaries/09.08_isolate_b_podsumowanie.md (pełna analiza poprzedniego biegu,
# sekcja 6 = rekomendowane kolejne kroki), configs/config_isolate_b.yaml (bieg-bliźniak, odwrotne A/B).

project:
  name: OtolithDinoStandalone
  version: "0.1.0"
  seed: 42

model:
  backbone: dinov2_vits14_reg     # niezmienione względem 22.07_reg / config_isolate_b.yaml
  use_metadata: false
  target_type: ordinal            # regression | ordinal | count_aware
  num_age_classes: 17             # max observed age = 16 (real data)
  dropout: 0.1
  head_type: both                 # coral | mil | both
  mil_count_weight: 1.0
  mil_sparsity_weight: 1.0
  mil_hidden_dim: 64
  coral_loss_weight: 0.5
  use_density_head: true
  density_count_weight: 1.0
  density_conc_weight: 1.0        # UWAGA: to jest WEWNĘTRZNY człon top-k w density_count_loss,
                                  # NIE to samo co density_concentricity_weight niżej (E9/Zmiana B)
                                  # — dwie różne, niebezpiecznie podobne nazwy, patrz 08.08 code-review.
  density_tv_weight: 0.03

  # ------------------------------------------------------------------------
  # ZMIANA A (05.08) — WŁĄCZONA, jedyna zmiana względem 22.07_reg w tym biegu.
  # Cross-patch self-attention w SAMEJ głowicy density (nn.TransformerEncoderLayer), zamiast
  # niezależnej per-patch oceny — pełny opis: src/model.py::AttentionDensityHead,
  # config_attention_first.yaml (ten sam komentarz). Nadal w 100% na stop-gradiencie.
  density_head_type: attention    # mlp (jak w produkcji) | attention (Zmiana A, WŁĄCZONA tutaj)
  density_attn_num_heads: 4       # JAWNIE NIEZWERYFIKOWANY punkt startowy (patrz komentarz oryginalny)
  density_attn_num_layers: 1

  # Zmiana B WYŁĄCZONA — waga 0,0 = zero wpływu, dokładnie jak w 22.07_reg (nie sam globalny/stary
  # E9 z window_deg=None — CAŁKOWICIE wyłączone, dla czystej izolacji względem PRAWDZIWEJ bazy).
  density_concentricity_weight: 0.0    # Zmiana B WYŁĄCZONA
  density_concentricity_bins: 12
  density_concentricity_window_deg: 45.0   # nieużywane przy wadze 0,0 — zostawione dla spójności z
                                       # innymi configami tej serii, gdyby ktoś kiedyś włączył wagę>0

data:
  image_dir: Z:/Photo/Otolithes/HER/Processed
  labels_csv: data/labels.csv
  image_size: 518
  patch_size: 14
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  num_workers: 0
  metadata_cols:
    - length_mm
    - weight_g
    - sex
    - population
  mask_background: true
  mask_cache_dir: null

  # Zmiana C WYŁĄCZONA — czysta kontrola, spójne z config_isolate_b.yaml.
  quarter_age_adjustment_enabled: false
  quarter_age_adjustment_campaigns:
    - BITS1q
    - BITS2q

training:
  epochs: 50
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  freeze_backbone_epochs: 5
  density_lr_mult: 2.0
  early_stopping_patience: 8
  early_stopping_metric: val_mae
  early_stopping_min_delta: 0.005
  early_stopping_ema: 0.3
  min_epochs: 12
  min_density_active: 1.0
  # density_gate_max_wait_epochs: nie ustawione = domyślne (08.08 fix) — bramka podda się po tylu
  # epokach bez poprawy WIEKU ile early_stopping_patience (8), licząc od momentu gdy wiek sam
  # przestał się poprawiać (nie od startu treningu). Jeśli density (jak w Run K) w ogóle nie
  # ożyje, ten bieg i tak NIE zjada pełnych 50 epok na próżno — patrz src/config.py docstring.
  device: auto
  checkpoint_dir: checkpoints
  log_dir: logs
  keep_only_best: true

inference:
  output_dir: outputs
  save_heatmaps: true
  save_overlays: true
  save_candidates: true
  increment_samples:
    top_k_best: 15
    top_k_worst: 15
    annotate_all: false

interpretation:
  method: auto
  heatmap_alpha: 0.5
  disable_fused_attention: true

candidates:
  min_peak_distance: 5
  prominence_threshold: 0.1
  inner_margin: 0.20
  density_image_size: 728
  density_crop_to_otolith: true
  density_crop_pad_frac: 0.02
  width_decay_weight: 1.0
  width_ceiling_weight: 3.0
  classical_concentricity_weight: 0.0

segmentation:
  method: radial
  frac: 0.18
  background_k: 3.0
  n_angles: 720
  smooth_sigma: 4.0
  gap_tolerance: 8
