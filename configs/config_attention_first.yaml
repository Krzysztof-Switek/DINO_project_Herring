# 05.08 — "słaby nadzór, uwaga jako podstawa" (weak_supervision_attention_first,
# plans and summaries/5.08_plan_TO_DO.md, plan sesji: zaktualizuj-pami-projektu-peppy-crane.md).
# Pełna, samodzielna kopia config.yaml (== receptura 22.07_reg) + TRZY nowe, niezależnie
# przełączalne mechanizmy naraz — dokładnie tak, jak użytkownik chciał je przetestować
# w kolejnym biegu. Każdy ma swoją własną flagę w configu, więc jeśli wynik tego biegu
# będzie niejednoznaczny, kolejny bieg może wyłączyć pojedynczą zmienną (ten sam schemat
# co 15.07_rx -> 16.07_rx, gdzie połączenie dwóch zmian naraz utrudniło odczyt wyniku).
#
# BEZPIECZEŃSTWO — nierówne dla trzech zmian, nie mylić:
#   Zmiana A (density_head_type=attention) i Zmiana B (density_concentricity_window_deg)
#   są bezpieczne KONSTRUKCYJNIE — obie liczone są na tym samym stop-gradient tensorze
#   co reszta głowicy density (patches.detach()), więc fizycznie nie mogą wpłynąć na
#   backbone/CORAL/wiek (tests/test_stage3_model.py potwierdza to testami jednostkowymi).
#   Zmiana C (quarter_age_adjustment_enabled) NIE jest bezpieczna konstrukcyjnie — zmienia
#   sam cel treningu CORAL dla ~40% datasetu (BITS1q/BITS2q), więc MOŻE przesunąć błąd
#   wieku w dowolną stronę. Wymaga uczciwego porównania z biegiem bez tej flagi.
#
# Zobacz też: outputs/DINO_proces.md (historia E9/TV/rejestrów), 31.07_radial_Analiza_wnioski.md
# (dlaczego stary, globalny E9 nie zadziałał — stąd Zmiana B).

project:
  name: OtolithDinoStandalone
  version: "0.1.0"
  seed: 42

model:
  backbone: dinov2_vits14_reg     # N+1 (15.07 Tor C): wariant Z REJESTRAMI — tłumi patche o ekstremalnej
                                  # normie (register tokens, Darcet 2023), które w 13.07 zapalały density na
                                  # glare/krawędziach zamiast na pierścieniach. Ten sam wymiar 384 → głowice bez zmian.
                                  # Warianty: dinov2_vits14 | *_vitb14 | *_vitl14 | *_reg
  use_metadata: false
  target_type: ordinal            # regression | ordinal | count_aware
  num_age_classes: 17             # max observed age = 16 (real data)
  dropout: 0.1
  # MIL weakly-supervised localisation (per-patch increment scoring)
  head_type: both                 # coral | mil | both
  mil_count_weight: 1.0           # weight of the MIL top-k concentration loss in the combined loss
  mil_sparsity_weight: 1.0        # weight of the background (off-region) term; higher = cleaner map
  mil_hidden_dim: 64              # patch head hidden layer width
  coral_loss_weight: 0.5          # weight of CORAL loss when head_type='both'
  # Kierunek B: odsprzęgnięta (stop-gradient) głowica density-map z count-consistency.
  # NIE dotyka backbone/CORAL/MIL (wiek bezpieczny). Mapa density = sygnał lokalizacji na kartach.
  use_density_head: true          # false = stare zachowanie (tylko MIL do lokalizacji)
  density_count_weight: 1.0       # waga straty density w sumie
  density_conc_weight: 1.0        # człon koncentracji (rozbija rozmyte rozwiązanie)
  density_tv_weight: 0.03         # N+3 (22.07): pierwsza próba ponownego włączenia TV, teraz MAŁE. Poprzedni pomiar
                                  # "TV dusi density" (15.07_rx, TV=0.1) był SPRZED maskowania tła; 20.07_reg
                                  # (maskowanie, TV=0) obudziło density już @epoka 10 (nie 23) — maskowanie mogło
                                  # samo rozwiązać problem, który TV kiedyś pogarszał. Sprawdzić w logu tego biegu,
                                  # czy wczesne budzenie się utrzymuje; jeśli się cofnie → wrócić do 0.0.
                                  # Liczone na patches.detach() (wiek bezpieczny).

  # ------------------------------------------------------------------------
  # ZMIANA A (05.08) — prawdziwa uwaga W SAMEJ głowicy density, nie tylko w backbonie.
  # Dziś (density_head_type: mlp) każdy kwadracik oceniany jest zupełnie niezależnie —
  # żaden "nie wie" nic o sąsiadach. AttentionDensityHead (src/model.py) dokłada warstwę
  # self-attention (nn.TransformerEncoderLayer) NAD tokenami patchy, żeby jeden kwadracik
  # mógł "pożyczyć" informację od innych — mostkować przerwy między fragmentami pierścienia,
  # zamiast każdy fragment oceniać w izolacji (inspiracja: CS-Net/CS²-Net, sieci do wykrywania
  # cienkich, częściowo widocznych struktur jak naczynia krwionośne). Nadal w 100% na
  # stop-gradiencie — bezpieczne dla wieku z definicji, nie tylko w praktyce.
  density_head_type: attention    # mlp (stare, domyślne) | attention (nowe)
  density_attn_num_heads: 4       # JAWNIE NIEZWERYFIKOWANY punkt startowy — 384/4=96, dzieli się
                                  # równo; nie testowane jeszcze na prawdziwym rozmiarze embeddingu
                                  # (tylko na mocku 64-wymiarowym w smoke teście).
  density_attn_num_layers: 1      # jw. — jedna warstwa, najtańszy start; więcej warstw = więcej
                                  # parametrów do wytrenowania zanim density w ogóle "ożyje".

  # ------------------------------------------------------------------------
  # ZMIANA B (05.08) — E9 v2: lokalna (nie globalna) spójność promieniowa.
  # Stary E9 (density_concentricity_weight bez window_deg) porównywał WSZYSTKIE kwadraciki
  # w danym koszyku promienia naraz, po całym obwodzie 360° — dał zerowy efekt lokalizacyjny
  # nawet przy 100-krotnie różnej wadze (31.07_radial_Analiza_wnioski.md), bo (a) matematycznie
  # kara była z natury za mała, i (b) koncepcyjnie karała normalną, częściową widoczność
  # pierścienia tak samo jak szum. density_concentricity_window_deg włącza wariant lokalny:
  # porównuje kwadracik TYLKO z sąsiadami w małym oknie kątowym — dokładnie ten sam pomysł,
  # który już raz zadziałał dla klasycznej (nie-trenowanej) wersji tej kary (_arc_band,
  # src/ring_extraction.py, sesja 29.07).
  density_concentricity_weight: 1.0    # >0 włącza karę; JAWNIE NIEZWERYFIKOWANA — skala
                                       # straty w wariancie lokalnym nie została jeszcze
                                       # zmierzona (inna niż w starym, globalnym E9 — nie
                                       # zakładać, że stary sweep wag 0.1/1.0/10.0 się przenosi).
  density_concentricity_bins: 12       # STAŁA liczba koszyków promienia (bez zmian z E9 v1)
  density_concentricity_window_deg: 45.0   # szerokość lokalnego okna kątowego. JAWNIE
                                       # NIEZWERYFIKOWANY punkt startowy (ten sam status co
                                       # inner_margin=0.20 niżej) — zbyt małe okno = prawie
                                       # nigdy 2 sąsiadów (kara wygasa); zbyt duże = z powrotem
                                       # zbliża się do starego, nieskutecznego zachowania globalnego.

data:
  image_dir: Z:/Photo/Otolithes/HER/Processed
  labels_csv: data/labels.csv
  image_size: 518                 # must be divisible by patch_size (14*37=518)
  patch_size: 14                  # DINOv2 default
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  num_workers: 0
  metadata_cols:
    - length_mm
    - weight_g
    - sex
    - population
  # Input masking (20.07 pre-training item): feed the model ONLY the segmented
  # otolith — CLS-attention diagnostic showed ~12-17% of attention landing on
  # background/edge. Masks computed once (otolith_axis.get_or_compute_mask) and
  # cached under data/masks_cache/ (mask_cache_dir: null → that default).
  mask_background: true
  mask_cache_dir: null

  # ------------------------------------------------------------------------
  # ZMIANA C (05.08) — "pierwsze półrocze -1". Ryby złowione w rejsach BITS1q/BITS2q
  # (styczeń-czerwiec) mogą jeszcze nie mieć uformowanego tegorocznego pierścienia w
  # chwili połowu — prawdziwa liczba w pełni uformowanych, widocznych przyrostów może
  # wynosić wiek_zapisany - 1, nie wiek_zapisany. Użytkownik wybrał WARIANT SZERSZY: "-1"
  # dotyczy JEDNOCZEŚNIE etykiety CORAL (wieku) i celu density (liczby przyrostów) — nie
  # tylko density. NIE JEST TO BEZPIECZNE KONSTRUKCYJNIE jak A/B — patrz nagłówek pliku.
  # Przesłanka ("czy Wiek w danych już to uwzględnia") wciąż NIEZWERYFIKOWANA empirycznie
  # (memory: quarter_age_convention_issue.md) — to prawdziwy eksperyment, nie pewnik.
  quarter_age_adjustment_enabled: true
  quarter_age_adjustment_campaigns:    # kampanie, dla których stosujemy -1 (BITS2q: 0 wierszy
    - BITS1q                          # w obecnym zbiorze, ale zostawione na wypadek przyszłych danych)
    - BITS2q

training:
  epochs: 50                      # sufit; early_stopping zdecyduje kiedy faktycznie zakończyć (poprzednie dobre biegi ~e37)
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine               # cosine | step | none
  freeze_backbone_epochs: 5       # freeze DINOv2 for first N epochs
  density_lr_mult: 2.0            # N+3 (22.07): pierwsza próba — density_head na stop-gradiencie budzi się
                                  # późno i dostawał dotąd ten sam LR co CORAL/MIL (które już działają dobrze);
                                  # 2.0 = szybsza nauka WYŁĄCZNIE tej głowicy, zero wpływu na backbone/wiek.
                                  # Wartość do skalibrowania po tym biegu, nie ostateczna.
  early_stopping_patience: 8      # N+1 (15.07 Tor B0): 15→8. Bieg 13.07 dobił do e52, a plateau było ~e26/e37
                                  # (patience liczy od EMA-best); 8 → stop ~e45, bez niedouczenia (EMA chroni przed szumem val_mae)
  early_stopping_metric: val_mae  # val_mae (zalecane) | val_loss
  early_stopping_min_delta: 0.005 # minimalna poprawa żeby zresetować licznik (>szum EMA → koniec mikro-resetów)
  early_stopping_ema: 0.3         # wygładzanie EMA metryki wyboru best.pt (0 = surowa; 0.3 = odporne na loterię)
  min_epochs: 12                  # N+2a (16.07): early stopping NIE zadziała przed tą epoką (podłoga)
  min_density_active: 1.0         # N+2a: best.pt/patience aktywne dopiero gdy density żyje (density_active≥1.0)
                                  # — bieg 15.07_rx zamroził best.pt @e17, gdy density_active=0. To gwarantuje
                                  # checkpoint z wytrenowaną lokalizacją (fallback: gdy density nigdy nie ożywa → jak dawniej)
  device: auto                    # auto | cpu | cuda | mps
  checkpoint_dir: checkpoints
  log_dir: logs
  keep_only_best: true            # trzymaj tylko best.pt w katalogu runu; kasuj checkpointy epok (każdy ~265 MB)

inference:
  output_dir: outputs
  save_heatmaps: true
  save_overlays: true
  save_candidates: true
  increment_samples:
    top_k_best: 15                # 15+15=30 kart — ta sama kuratorska próba co wszystkie
    top_k_worst: 15               # poprzednie porównania (21.07/22.07/23.07/31.07), żeby
                                  # ten bieg był od razu uczciwie porównywalny z historią.
    annotate_all: false   # true = kropki + galeria (sekcja G raportu) dla WSZYSTKICH
                          # obrazów testowych (wolniej, większy HTML); false = tylko top-k

interpretation:
  method: auto                    # auto | patch_token_importance | mil_patch_probs
  heatmap_alpha: 0.5
  disable_fused_attention: true   # true = wymuś wanilkową uwagę DINOv2 → prawdziwa uwaga CLS na kartach
                                  # (wolniej); false = szybciej, panel CLS używa oznaczonego proxy L2 gdy brak

candidates:
  min_peak_distance: 5            # min patch-distance between candidate increments
  prominence_threshold: 0.1
  # 22.07: podniesione z 0.05 po przeglądzie literatury (ICES/BHARSG Baltic Herring Age
  # Reading Workshop — pierwsza strefa roczna L1 to zmienna-szerokościowo STREFA, nie punkt;
  # mylenie pierwszego pierścienia z fałszywym "checkiem" to udokumentowany problem u
  # śledzia). 0.20 to JAWNIE NIEZWERYFIKOWANY dla śledzia bałtyckiego punkt startowy
  # (0.15-0.30 z ekstrapolacji sardynki/biologii wzrostu, nie zmierzona wartość) — patrz
  # plans and summaries/22.07_TO_DO.MD.
  inner_margin: 0.20
  # 22.07: wyższa efektywna rozdzielczość TYLKO dla density (wykrywanie kandydatów na
  # kartach + localization_quality.json) — inference-time, nie trening; CORAL dalej liczy
  # się na data.image_size (518), zero ryzyka dla wieku. Pierwsza próba, do skalibrowania.
  density_image_size: 728         # 728/14=52 -> 52x52=2704 patchy (~2x dzisiejszych 1369)
  density_crop_to_otolith: true   # crop do bbox maski PRZED skalowaniem — patche nie marnują
                                  # się na tło (dziś tylko zamalowane, nadal zajmuje miejsce w siatce)
  density_crop_pad_frac: 0.02     # zmierzone na 30 kartach (22.07): 0.05 zjadał niemal cały dostępny
                                  # margines (bbox 96.5% ramki); 0.02 zostawia realne ~11% przycięcia
                                  # przy wciąż bezpiecznym buforze na niedoskonałość segmentacji
  # 23.07: biologiczny priorytet wzrostu otolitu w selektorze DP (select_increments/
  # fuse_increments) — pierwszy przyrost (od PRAWDZIWEGO jądra, nie od inner_margin) jest
  # najszerszy, kolejne co do zasady się zwężają (rule of thumb, nie twarda reguła). Obie
  # kary MIĘKKIE (skalowane wynikiem kandydata), nie twarde ograniczenia. width_ceiling_weight
  # (nigdy nie przekraczaj szerokości pierwszego) silniejsza niż width_decay_weight (lokalna
  # preferencja malejąca) — użytkownik określił pierwszą regułę mocniej ("nie mogą być
  # większe") niż drugą ("rule of thumb"). JAWNIE NIEZWERYFIKOWANY punkt startowy (ten sam
  # status co inner_margin=0.20) — nie skalibrowane na prawdziwych kartach.
  width_decay_weight: 1.0
  width_ceiling_weight: 3.0
  # 29.07: klasyczny, NIE-trenowany odpowiednik E9 (model.density_concentricity_weight)
  # — kara za wariancję sygnału klasycznego między promieniami przy tym samym promieniu
  # klastra (src/ring_extraction.py::_scored_classical_cluster). 0.0 = wyłączone, zero
  # zmiany zachowania. JAWNIE NIEZWERYFIKOWANY punkt startowy, do zmierzenia przez
  # scripts/diagnostics/sweep_classical_concentricity_weight.py.
  classical_concentricity_weight: 0.0

segmentation:                     # otolith outline detection (src/otolith_axis.py)
  method: radial                  # radial (smooth, reaches faint rim) | threshold (Otsu+hysteresis fallback)
  frac: 0.18                      # per-ray reach = fraction of that ray's body brightness (↓ = capture more faint margin)
  background_k: 3.0               # background floor = bg_mean + k·bg_std
  n_angles: 720                   # rays cast from the nucleus
  smooth_sigma: 4.0               # periodic r(θ) smoothing — low = follow the scalloped teeth, high = smooth envelope
  gap_tolerance: 8                # px a ray may dip below threshold before the boundary commits
